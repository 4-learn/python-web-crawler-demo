<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 1000 400" role="img" aria-labelledby="crawler-title crawler-desc">
  <title id="crawler-title">Python 爬蟲在 AI 系統中的位置</title>
  <desc id="crawler-desc">資料來源經過爬蟲（選工具、守規則、驗證）離線整理成附來源資訊的 JSONL 與 MariaDB，再交給 Pandas 分析與 LLM 問答使用。</desc>
  <defs>
    <marker id="cr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
    <marker id="cr-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#f5f5f5"/>

  <text x="40" y="48" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" letter-spacing="1.2">01 · SOURCE</text>
  <text x="270" y="48" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" letter-spacing="1.2">02 · CRAWL（離線、定期）</text>
  <text x="595" y="48" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" letter-spacing="1.2">03 · STORE</text>
  <text x="810" y="48" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" letter-spacing="1.2">04 · USE</text>

  <!-- 01 資料來源 -->
  <rect x="40" y="75" width="185" height="240" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <text x="62" y="112" fill="#2d3142" font-family="Noto Sans TC" font-size="20" font-weight="700">資料來源</text>
  <text x="62" y="152" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">① 官方 API</text>
  <text x="80" y="172" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">JSON・開放資料</text>
  <text x="62" y="208" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">② 靜態網頁</text>
  <text x="80" y="228" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">HTML・分頁</text>
  <text x="62" y="264" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">③ 動態網頁</text>
  <text x="80" y="284" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">JavaScript・登入</text>

  <path d="M225 195 H262" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#cr-arrow)"/>

  <!-- 02 爬蟲 -->
  <rect x="265" y="65" width="290" height="260" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="2"/>
  <rect x="287" y="85" width="98" height="22" rx="2" fill="#bf4520"/>
  <text x="336" y="100" text-anchor="middle" fill="#f5f5f5" font-family="Noto Sans TC" font-size="11" font-weight="700">這門課</text>
  <text x="287" y="140" fill="#2d3142" font-family="Noto Sans TC" font-size="20" font-weight="700">Python 爬蟲</text>
  <text x="287" y="176" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">選工具</text>
  <text x="345" y="176" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">requests → bs4 → Playwright</text>
  <text x="287" y="210" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">守規則</text>
  <text x="345" y="210" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">robots.txt・速率・重試</text>
  <text x="287" y="244" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">會驗證</text>
  <text x="345" y="244" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">筆數・抽樣・pytest</text>
  <text x="287" y="278" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">能更新</text>
  <text x="345" y="278" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">content_hash・ETag</text>
  <text x="287" y="309" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">+ OpenCode 幫你寫</text>

  <path d="M555 195 H587" fill="none" stroke="#bf4520" stroke-width="2" marker-end="url(#cr-arrow-accent)"/>

  <!-- 03 儲存 -->
  <rect x="590" y="95" width="185" height="200" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <text x="612" y="132" fill="#2d3142" font-family="Noto Sans TC" font-size="20" font-weight="700">可信的資料</text>
  <text x="612" y="168" fill="#2d3142" font-family="Noto Sans TC" font-size="14" font-weight="600">JSONL・MariaDB</text>
  <text x="612" y="200" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">source_url</text>
  <text x="612" y="222" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">fetched_at</text>
  <text x="612" y="244" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">content_hash</text>
  <text x="612" y="272" fill="#5a6580" font-family="Noto Sans TC" font-size="12">說得出來源、可重新抓</text>

  <!-- 04 使用 -->
  <path d="M775 165 C795 165 790 120 805 120" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#cr-arrow)"/>
  <path d="M775 225 C795 225 790 270 805 270" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#cr-arrow)"/>
  <rect x="808" y="80" width="160" height="82" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <text x="828" y="114" fill="#2d3142" font-family="Noto Sans TC" font-size="17" font-weight="700">資料分析</text>
  <text x="828" y="140" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">Pandas・EDA</text>
  <rect x="808" y="230" width="160" height="82" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
  <text x="828" y="264" fill="#2d3142" font-family="Noto Sans TC" font-size="17" font-weight="700">LLM 問答</text>
  <text x="828" y="290" fill="#5a6580" font-family="JetBrains Mono,monospace" font-size="12">RAG・附出處</text>

  <rect x="290" y="346" width="420" height="36" rx="4" fill="#f5f5f5" stroke="rgba(45,49,66,0.16)"/>
  <text x="500" y="370" text-anchor="middle" fill="#4f5d75" font-family="Noto Sans TC" font-size="16">不只抓得到，還要抓得對、說得出來源、能重新抓</text>
</svg>
